name: Build joy_side_template for Windows

# 桌面平台之一：Windows（x64 / ARM64 矩阵）。
# 桌面构建把 assets/ POST_BUILD 复制到 build/Release/，一起上传即完整可运行包。
on:
  workflow_dispatch:
  pull_request:

jobs:
  build-win:
    name: Build for Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Configure
        shell: cmd
        run: |
          cmake -DCMAKE_SYSTEM_NAME=Windows ^
                -DCMAKE_SYSTEM_VERSION="10.0" ^
                -A${{ matrix.arch }} ^
                -S . -B build

      - name: Build
        run: cmake --build build --target joy_side_template --config Release

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: joy_side_template-Windows-${{ matrix.arch }}
          retention-days: 7
          path: |
            build/Release/**
